# Apply on merge — with the destroy gate. A FRESH plan runs here (never a
# stale PR artifact: state may have moved between plan and merge), and any
# plan proposing a delete fails the job and waits for a human. That is the
# same zero-destroys discipline the original imports were gated on, enforced
# by something that does not get tired. Run a destructive change deliberately:
# apply it from the console shell, or re-run this after reviewing.
#
# The OIDC role (gha-cloudflare-iac-apply) is assumable only from master of
# this repo; its AWS reach is the state object alone.
#
# workflow_dispatch exists because the push trigger is not guaranteed to fire:
# during the GitHub Actions outage of 2026-08-06 a merge to master produced no
# run at all, and with no manual trigger the only way to apply was to push
# another commit. Dispatch runs the SAME job — fresh plan, same destroy gate,
# no shortcuts. It is restricted to master below: the OIDC sub for a dispatch
# is the ref it was started from, so a dispatch off a branch would fail at
# AssumeRole anyway; the guard just makes that a clear message instead of an
# opaque STS error.

name: apply

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Applies serialize; never cancel a running apply.
concurrency:
  group: tofu-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache

jobs:
  apply:
    # Dispatch is only legitimate from master (see the header): fail fast and
    # legibly rather than at AssumeRole.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::376513993906:role/gha-cloudflare-iac-apply
          aws-region: ca-central-1

      - uses: actions/cache@v4
        with:
          path: .plugin-cache
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('live/.terraform.lock.hcl') }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && tofu init -input=false

      - name: tofu plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          tofu plan -detailed-exitcode -input=false -no-color -out=tfplan
          rc=$?
          set -e
          echo "exitcode=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" -eq 1 ] && exit 1 || true

      - name: Destroy gate
        if: steps.plan.outputs.exitcode == '2'
        run: |
          destroys=$(tofu show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address')
          if [ -n "$destroys" ]; then
            echo "::error::Plan contains destroys — refusing to auto-apply. A human must run this."
            echo "$destroys"
            exit 1
          fi

      - name: tofu apply
        if: steps.plan.outputs.exitcode == '2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tofu apply -input=false -no-color tfplan
