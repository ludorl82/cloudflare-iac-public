# Nightly drift detection for this repo: `tofu plan` against live Cloudflare,
# result pushed to Uptime Kuma monitor 43. Self-contained since 2026-08-07:
# GitHub schedules it, GitHub runs it, and it reports for itself.
#
# It got here in two steps the same day, and both are worth knowing.
#
# 1. The plan left the console container. Running tofu there meant the S3 state
#    backend used whatever sat in that container's ~/.aws — the human
#    `ludorl82` user, AdministratorAccess, static key from 2025-05-10. A
#    nightly read of one state object ran as account admin. State is now read
#    by gha-cloudflare-iac-drift, assumed via OIDC, scoped to that one object,
#    expiring with the run.
#
# 2. The scheduling and reporting left Cronicle. Briefly, Cronicle ssh'd a
#    forced-command key into the console container, which dispatched this
#    workflow and pushed the result from the LAN — because Kuma's push endpoint
#    sits behind Access and a runner's address can never be on an IP-list
#    bypass. That indirection is gone: a path-scoped Access app
#    (kuma.pub.example.com/api/push, cloudflare-iac live/access-apps.tf) admits a
#    SERVICE TOKEN, so the runner authenticates with CF-Access-Client-Id /
#    -Secret and pushes directly. The dashboard itself stays OTP-only — the
#    app is scoped to the path, and widening it would hand the dashboard to a
#    token.
#
# WHAT WATCHES THE WATCHER: nothing here detects a schedule that never fires,
# and GitHub can silently not fire — the 2026-08-06 Actions outage swallowed a
# merge to this repo's cp-1 with no run created at all. That is covered by
# Kuma 43 being a PUSH monitor: its grace interval exceeds the daily cadence,
# so a check that never runs surfaces as a missed heartbeat, exactly like one
# that runs and fails. Absence is alerted on rather than assumed benign. If
# that monitor is ever converted away from push, this loses its safety net.
#
# The Cloudflare API credential is NOT solved by any of this and cannot be:
# Cloudflare has no OIDC federation. CLOUDFLARE_API_TOKEN stays a stored repo
# secret; what is improvable is its scope and expiry, not its lifetime.
#
# The plan runs with -lock=false: it never writes state and never takes the
# lock, so a concurrent apply is never blocked.

name: drift

on:
  # Triggered by Cronicle (event "IaC Drift Checks", 04:30 America/Montreal)
  # since 2026-08-09, not by a cron here. GitHub cron is UTC with no timezone
  # support, so the old "30 11 * * *" meant 07:30 under EDT and 06:30 under
  # EST; Cronicle schedules in local time and does not slip. More importantly
  # this check GATES the Nightly Diagram Sync fifteen minutes later, so its
  # timing is now enforced by one scheduler rather than agreed between two.
  #
  # Kuma 43's heartbeat is unchanged and still absence-shaped, so it now also
  # covers "Cronicle never fired".
  workflow_dispatch:

permissions:
  id-token: write # OIDC exchange
  contents: read

concurrency:
  group: tofu-drift
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::376513993906:role/gha-cloudflare-iac-drift
          aws-region: ca-central-1

      - uses: actions/cache@v4
        with:
          path: .plugin-cache
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('live/.terraform.lock.hcl') }}

      - name: tofu init
        id: init
        run: |
          set +e
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu init -input=false -no-color >init.log 2>&1
          echo "exitcode=$?" >>"$GITHUB_OUTPUT"

      - name: tofu plan
        id: plan
        if: steps.init.outputs.exitcode == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          tofu plan -detailed-exitcode -lock=false -input=false -no-color >plan.log 2>&1
          echo "exitcode=$?" >>"$GITHUB_OUTPUT"

      # Report to Kuma directly. Until 2026-08-07 this went the long way
      # round — Cronicle ssh'd into the console container, which dispatched
      # this workflow and pushed the result from the LAN — because Kuma's push
      # endpoint sits behind Access and a runner's address can never be on an
      # IP-list bypass. It now comes straight from here through a path-scoped
      # Access app (kuma.pub.example.com/api/push) gated by a service token.
      #
      # `if: always()` is the point: a drift check that dies quietly is the one
      # failure this exists to prevent. Kuma 43 is a push monitor whose grace
      # interval exceeds the daily cadence, so a run that never happens at all
      # — a GitHub cron that does not fire, an outage like 2026-08-06 — still
      # surfaces as a missed heartbeat.
      - name: Push result to Kuma
        if: always()
        env:
          PUSH_URL: ${{ secrets.KUMA_PUSH_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          INIT_RC: ${{ steps.init.outputs.exitcode }}
          PLAN_RC: ${{ steps.plan.outputs.exitcode }}
        run: |
          set -u
          push() {
            curl -fsS -G "$PUSH_URL" \
              -H "CF-Access-Client-Id: $CF_ID" \
              -H "CF-Access-Client-Secret: $CF_SECRET" \
              --data-urlencode "status=$1" \
              --data-urlencode "msg=$2" >/dev/null
          }

          if [ "${INIT_RC:-1}" != "0" ]; then
            push down "cloudflare drift check broken: tofu init failed: $(tail -c 150 init.log | tr '\n' ' ')"
            exit 1
          fi

          case "${PLAN_RC:-}" in
            0) push up   "no drift — cloudflare matches cloudflare-iac" ;;
            2) push down "CLOUDFLARE DRIFT: $(grep -E '^Plan:' plan.log | head -1 || echo 'see job log')"; exit 1 ;;
            *) push down "cloudflare drift check broken (rc=${PLAN_RC:-?}): $(tail -c 150 plan.log | tr '\n' ' ')"; exit 1 ;;
          esac

      - name: Surface plan output in the job log
        if: always()
        run: tail -100 plan.log || true
